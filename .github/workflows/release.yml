name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: github.com/unkmonster/tmd

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Keep the build image on the Go version go.mod requires
        shell: bash
        run: |
          want="$(sed -n 's/^go \([0-9]\+\.[0-9]\+\).*/\1/p' go.mod | head -n1)"
          have="$(sed -n 's/^FROM .*golang:\([0-9]\+\.[0-9]\+\).*/\1/p' Dockerfile | head -n1)"
          if [ -z "$want" ] || [ -z "$have" ]; then
            echo "::error::cannot read the Go version from go.mod or Dockerfile"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::go.mod requires Go $want, Dockerfile builds with Go $have"
            exit 1
          fi
          echo "Go $want matches the build image"

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check the console scripts
        shell: bash
        run: |
          for file in internal/api/web/download/*.js; do
            node --check "$file"
          done

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          suffix=""
          os_name="${{ runner.os }}"
          case "$os_name" in
            Windows) os_name="windows"; suffix=".exe" ;;
            Linux) os_name="linux" ;;
            macOS) os_name="darwin" ;;
          esac
          go build -trimpath -o "bin/tmdp-${os_name}-${{ matrix.arch }}${suffix}" \
            -v -ldflags "-w -s -X ${{ env.MODULE }}/internal/api.Version=${{ github.ref_name }}" .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ runner.os }}-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error

  docker:
    name: Publish image
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image names
        id: prep
        shell: bash
        run: |
          echo "image_ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_dockerhub=docker.io/leeexx00/tmdp" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.prep.outputs.image_ghcr }}
            ${{ steps.prep.outputs.image_dockerhub }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TMD
            org.opencontainers.image.description=Twitter media downloader with a built-in web console

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-artifacts
        run: sha256sum * > checksums.txt

      - name: Pick curated release notes
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
            echo "using $file"
          else
            echo "no curated notes for ${GITHUB_REF_NAME}, relying on generated notes"
          fi

      - name: Publish release with curated notes
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish release
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
